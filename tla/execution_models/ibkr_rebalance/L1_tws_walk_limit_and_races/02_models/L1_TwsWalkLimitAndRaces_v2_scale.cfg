\* High-effort scaling configuration for L1_TwsWalkLimitAndRaces_v2
\* Expands MaxWalkSteps = 4 and ReqQty = 300 across both sides and both tick regimes.
SPECIFICATION Spec

CONSTANTS
    Sides = {"BUY", "SELL"}
    ArrivalMidCents = 10000
    ReqQty = 300
    LotSize = 100
    MaxWalkSteps = 4
    LiveQuoteSet = {"TIGHT_MOVE", "WIDE_SPREAD", "HALTED"}

INVARIANT TypeOK
INVARIANT LimitNeverExceedsSlippageCeiling
INVARIANT NoDuplicateOrderOnModify
INVARIANT NoModifyOnTerminalOrder
INVARIANT FillAccountingExact
INVARIANT CoarseTickWalkReachesNextTick
