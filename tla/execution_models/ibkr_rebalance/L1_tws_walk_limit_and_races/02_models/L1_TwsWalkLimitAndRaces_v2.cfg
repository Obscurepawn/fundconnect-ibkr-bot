\* Primary full-property configuration for L1_TwsWalkLimitAndRaces_v2
\* Verifies fixes for L1-A (DoneStates guard), L1-B (post-get_quotes poll),
\* L1-C (Error 104 rollback), and M1 (coarse HKEX tick walk continuation).
SPECIFICATION Spec

CONSTANTS
    Sides = {"BUY", "SELL"}
    ArrivalMidCents = 10000
    ReqQty = 200
    LotSize = 100
    MaxWalkSteps = 3
    LiveQuoteSet = {"TIGHT_MOVE", "WIDE_SPREAD", "HALTED"}

INVARIANT TypeOK
INVARIANT LimitNeverExceedsSlippageCeiling
INVARIANT NoDuplicateOrderOnModify
INVARIANT NoModifyOnTerminalOrder
INVARIANT FillAccountingExact
INVARIANT CoarseTickWalkReachesNextTick
