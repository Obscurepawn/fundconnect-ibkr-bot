\* Primary full-property configuration for L3_CrashRetryIdempotency_v2
\* Verifies fixes for L3-A (reqAllOpenOrders across clientIds), L3-B (persist FILLED only),
\* L3-C (`:cap:{orig}:{scaled}` intent_id), and L3-D (immediate FX state checkpoint & open FX check).
SPECIFICATION Spec

CONSTANTS
    InitSellQty = 100
    TargetBuyQty = 100
    BootstrapFxUsd = 30
    Run1ClientId = 26
    Run2ClientIds = {26, 27}
    FxConfigs = {"NO_FX", "WITH_FX"}

INVARIANT TypeOK
INVARIANT NoDoubleOrderAcrossClientIds
INVARIANT NoStrandedUnfilledTargetOnRetry
INVARIANT NoScaledBuyPermanentUnderfill
INVARIANT NoDuplicateFxConversionOnRetry
