\* High-effort scaling configuration for L3_CrashRetryIdempotency_v2
\* Expands holdings/targets (InitSellQty=200, TargetBuyQty=200, BootstrapFxUsd=50) and
\* adds manual TWS clientId=0 alongside clientIds 26 and 27.
SPECIFICATION Spec

CONSTANTS
    InitSellQty = 200
    TargetBuyQty = 200
    BootstrapFxUsd = 50
    Run1ClientId = 26
    Run2ClientIds = {0, 26, 27}
    FxConfigs = {"NO_FX", "WITH_FX"}

INVARIANT TypeOK
INVARIANT NoDoubleOrderAcrossClientIds
INVARIANT NoStrandedUnfilledTargetOnRetry
INVARIANT NoScaledBuyPermanentUnderfill
INVARIANT NoDuplicateFxConversionOnRetry
