    QuoteRegimes = {"HALTED", "FLASH_CRASH", "SEVERE_DOWN", "ADVERSE_DOWN", "MILD", "WIDE_MILD", "MOD_UP", "SURGE_UP"}
    MinNotionalCents = 1200000

INVARIANT TypeOK
INVARIANT BudgetConservation
INVARIANT NoNegativeOrNaNQty
INVARIANT HkexTickAndBoardLotValid
INVARIANT SellBeforeBuyDeterministicOrder
