\* Synced v2 high-effort scaling configuration for L0_GapSizingAndHkex_v2
\* Adds official 500-share board lot on 0002.HK, intermediate holdings (partial trim &
\* hold-at-target), and small-notional churn boundary (1500000c = 15,000 HKD).
SPECIFICATION Spec

CONSTANTS
    LotS1 = 500
    LotS2 = 200
    InitQtySet = {0, 500, 1500}
    BaseBudgetSet = {0, 1500000, 10000000}
    DefBaseBudget = 2000000
    QuoteRegimes = {"HALTED", "FLASH_CRASH", "SEVERE_DOWN", "ADVERSE_DOWN", "MILD", "WIDE_MILD", "MOD_UP", "SURGE_UP"}
    MinNotionalCents = 1200000

INVARIANT TypeOK
INVARIANT BudgetConservation
INVARIANT NoNegativeOrNaNQty
INVARIANT HkexTickAndBoardLotValid
INVARIANT SellBeforeBuyDeterministicOrder
